name: Lint
on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}
    cancel-in-progress: true

jobs:
    format:
        name: Format
        runs-on: ubuntu-24.04
        permissions:
            contents: write # Needed to push
            actions: write # Allow formatting actions too

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{secrets.TOKEN||github.token}}
                  persist-credentials: true

            - name: Setup Node.JS
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Format JS
              run: node --run format

            - name: Format Python
              uses: psf/black@35ea67920b7f6ac8e09be1c47278752b1e827f76 # 26.3.0
              with:
                  options: ""
                  jupyter: true

            - name: Assert clean
              if: startsWith(github.ref_name, 'dependabot/') == true
              run: if [[ `git status --porcelain` ]]; then exit 1; fi

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  commit_message: Format

    analyze:
        name: Analyze
        runs-on: ubuntu-24.04
        permissions:
            security-events: write # Used by github/codeql-action
        strategy:
            fail-fast: false
            matrix:
                language: [javascript, python]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup CodeQL
              uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
              with:
                  languages: ${{matrix.language}}
                  queries: security-and-quality

            - name: Analyze
              uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

    types:
        name: Typecheck JS
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.JS
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: package.json

            - name: Install
              run: npm ci

            - name: Typecheck
              run: node --run types
